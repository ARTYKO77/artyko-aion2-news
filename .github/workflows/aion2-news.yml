
name: ARTYKO AION 2 News

on:
  workflow_dispatch:

  schedule:
    - cron: '7 */2 * * *'

permissions:
  contents: write

concurrency:
  group: artyko-aion2-news
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le librerie
        run: pip install requests beautifulsoup4

      - name: Controlla le notizie AION 2
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python aion2_news.py

      - name: Salva lo storico delle notizie
        run: |
          if [ -f seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add seen_articles.json

            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna storico ARTYKO NEWS"
              git push
            else
              echo "Nessuna nuova notizia AION 2 da salvare."
            fi
          fi
