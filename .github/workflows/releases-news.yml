
name: ARTYKO Game Releases

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare il calendario su Discord?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "0 7,8 * * *"

permissions:
  contents: write

concurrency:
  group: artyko-game-releases
  cancel-in-progress: false

jobs:
  game-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa librerie
        run: pip install requests beautifulsoup4

      - name: Verifica orario italiano
        id: orario
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event_name = os.environ.get("EVENT_NAME", "")
          publish = os.environ.get("PUBLISH", "").lower() == "true"

          if event_name == "schedule":
              now = datetime.now(ZoneInfo("Europe/Rome"))
              allowed = now.hour == 9
              print(f"Ora italiana: {now.isoformat()}")
              print(f"Pubblicazione automatica consentita: {allowed}")
          else:
              allowed = publish
              print(f"Pubblicazione manuale richiesta: {allowed}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"publish={'true' if allowed else 'false'}\n")
          PY

      - name: Controlla calendario uscite
        env:
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          RELEASES_DRY_RUN: ${{ steps.orario.outputs.publish == 'true' && 'false' || 'true' }}
        run: python -u releases_news.py

      - name: Salva storico pubblicazioni
        if: ${{ steps.orario.outputs.publish == 'true' }}
        run: |
          if [ ! -f releases_seen.json ]; then
            echo "Storico mancante."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add releases_seen.json

          if git diff --cached --quiet; then
            echo "Nessun aggiornamento allo storico."
            exit 0
          fi

          git commit -m "Update game releases history"

          if git push origin HEAD:main; then
            echo "Storico salvato correttamente."
          else
            echo "Push iniziale non riuscito."
            echo "Tentativo di recupero..."
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Storico salvato dopo recupero."
          fi
