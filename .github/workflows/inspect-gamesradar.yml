
name: ARTYKO Inspect GamesRadar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-gamesradar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests beautifulsoup4

      - name: Analizza struttura GamesRadar
        run: python -u inspect_gamesradar.py
