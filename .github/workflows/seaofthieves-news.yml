
name: ARTYKO Sea of Thieves News

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare le notizie su Discord?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write

concurrency:
  group: artyko-seaofthieves-news
  cancel-in-progress: false

jobs:
  seaofthieves-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa librerie
        run: pip install requests

      - name: Controlla notizie Sea of Thieves
        env:
          DISCORD_WEBHOOK_SEAOFTHIEVES: ${{ secrets.DISCORD_WEBHOOK_SEAOFTHIEVES }}
          SEAOFTHIEVES_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'false' || 'true' }}
        run: python -u seaofthieves_news.py

      - name: Salva storico notizie
        if: ${{ success() && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: |
          if [ -f seaofthieves_seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add seaofthieves_seen_articles.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Sea of Thieves news history"
              git pull --rebase origin main
              git push origin HEAD:main
            else
              echo "Nessuna nuova notizia da salvare."
            fi
          else
            echo "Storico non ancora presente."
          fi
