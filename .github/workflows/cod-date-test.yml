
name: ARTYKO COD Date Test

on:
  workflow_dispatch:

jobs:
  test-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests beautifulsoup4

      - name: Controlla date articoli COD
        run: python cod_date_test.py
