
name: ARTYKO Tarkov Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarkov-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests beautifulsoup4

      - name: Verifica sito ufficiale Tarkov
        run: python -u tarkov_test.py
