
name: ARTYKO COD News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cod-news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests beautifulsoup4

      - name: Esegui ARTYKO COD NEWS
        env:
          DISCORD_WEBHOOK_COD: ${{ secrets.DISCORD_WEBHOOK_COD }}
        run: python cod_news.py

      - name: Salva storico articoli
        run: |
          if [ -f cod_seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cod_seen_articles.json
            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna storico COD NEWS"
              git push
            fi
          fi
