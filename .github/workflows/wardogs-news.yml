
name: ARTYKO Wardogs News

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare le nuove notizie su Discord?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '17,37,57 * * * *'

permissions:
  contents: write

concurrency:
  group: artyko-wardogs-news
  cancel-in-progress: false

jobs:
  wardogs-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Controlla notizie WARDOGS
        env:
          DISCORD_WEBHOOK_WARDOGS: ${{ secrets.DISCORD_WEBHOOK_WARDOGS }}
          WARDOGS_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'false' || 'true' }}
        run: python -u wardogs_news.py

      - name: Salva storico notizie
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: |
          if [ -f wardogs_seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wardogs_seen_articles.json

            if ! git diff --cached --quiet; then
              git commit -m "Update WARDOGS news history"
              git push
            else
              echo "Nessuna nuova notizia da salvare."
            fi
          fi
