
name: ARTYKO Gaming News

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaming-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Test fonti Gaming News
        env:
          GAMING_DRY_RUN: 'true'
        run: python -u gaming_news.py
