
name: ARTYKO Tarkov News

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare le nuove notizie su Discord?"
        required: true
        type: boolean
        default: false

      test_cover:
        description: "Inviare un solo messaggio di prova con la copertina?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '13 */2 * * *'

permissions:
  contents: write

concurrency:
  group: artyko-tarkov-news
  cancel-in-progress: false

jobs:
  tarkov-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Controlla notizie Tarkov
        env:
          DISCORD_WEBHOOK_TARKOV: ${{ secrets.DISCORD_WEBHOOK_TARKOV }}
          TARKOV_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'false' || 'true' }}
          TARKOV_TEST_COVER: ${{ github.event_name == 'workflow_dispatch' && inputs.test_cover == true && 'true' || 'false' }}
        run: python -u tarkov_news.py

      - name: Salva storico notizie
        if: ${{ github.event_name == 'schedule' || (inputs.publish == true && inputs.test_cover != true) }}
        run: |
          if [ -f tarkov_seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add tarkov_seen_articles.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Tarkov news history"
              git push
            else
              echo "Nessuna nuova notizia da salvare."
            fi
          fi
