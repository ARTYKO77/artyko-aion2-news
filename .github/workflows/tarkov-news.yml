
name: ARTYKO Tarkov News

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare le notizie su Discord?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: artyko-tarkov-news
  cancel-in-progress: false

jobs:
  tarkov-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Esegui ARTYKO TARKOV NEWS
        env:
          DISCORD_WEBHOOK_TARKOV: ${{ secrets.DISCORD_WEBHOOK_TARKOV }}
          TARKOV_DRY_RUN: ${{ inputs.publish == true && 'false' || 'true' }}
        run: python -u tarkov_news.py

      - name: Salva storico Tarkov
        if: ${{ inputs.publish == true }}
        run: |
          if [ -f tarkov_seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tarkov_seen_articles.json
            if ! git diff --cached --quiet; then
              git commit -m "Aggiorna storico Tarkov NEWS"
              git push
            fi
          fi
