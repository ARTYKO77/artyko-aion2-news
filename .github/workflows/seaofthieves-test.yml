
name: ARTYKO Sea of Thieves - Test Steam

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-steam:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifica notizie Sea of Thieves da Steam
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = (
              "https://api.steampowered.com/"
              "ISteamNews/GetNewsForApp/v2/"
              "?appid=1172620&count=10&maxlength=300"
          )

          print("ARTYKO - TEST STEAM SEA OF THIEVES")
          print("Controllo API ufficiale Steam...", flush=True)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "ARTYKO-NewsBot/1.0",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=25
              ) as response:
                  data = json.load(response)
                  print(f"HTTP: {response.status}")

              news = data.get("appnews", {}).get(
                  "newsitems", []
              )

              print(f"Notizie ricevute: {len(news)}")

              for index, article in enumerate(
                  news, start=1
              ):
                  print(f"\nNOTIZIA {index}")
                  print(
                      "Titolo:",
                      article.get("title", "N/D")
                  )
                  print(
                      "Fonte:",
                      article.get("feedname", "N/D")
                  )
                  print(
                      "Link:",
                      article.get("url", "N/D")
                  )

              if not news:
                  raise RuntimeError(
                      "Steam risponde, ma non ci sono notizie."
                  )

              print(
                  "\nSUCCESSO: Steam accessibile da GitHub!"
              )

          except Exception as error:
              print(
                  f"\nTEST FALLITO: "
                  f"{type(error).__name__}: {error}"
              )
              raise
          PY
