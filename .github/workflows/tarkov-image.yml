
name: ARTYKO Tarkov Image Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Test copertina Discord Tarkov
        env:
          DISCORD_WEBHOOK_TARKOV: ${{ secrets.DISCORD_WEBHOOK_TARKOV }}
        run: python -u tarkov_image_test.py
