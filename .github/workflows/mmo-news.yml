
name: ARTYKO MMO News

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mmo-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests feedparser

      - name: Test fonti MMO
        env:
          MMO_DRY_RUN: 'true'
        run: python -u mmo_news.py
