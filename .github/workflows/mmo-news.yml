
name: ARTYKO MMO News

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Pubblicare le notizie MMO su Discord?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '9 */4 * * *'

permissions:
  contents: write

concurrency:
  group: artyko-mmo-news
  cancel-in-progress: false

jobs:
  mmo-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests feedparser beautifulsoup4

      - name: Controlla notizie MMO
        env:
          DISCORD_WEBHOOK_MMO: ${{ secrets.DISCORD_WEBHOOK_MMO }}
          MMO_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.publish == true) && 'false' || 'true' }}
        run: python -u mmo_news.py

      - name: Salva storico notizie MMO
        if: ${{ always() && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: |
          if [ -f mmo_seen_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add mmo_seen_articles.json

            if ! git diff --cached --quiet; then
              git commit -m "Update MMO news history"
              git pull --rebase origin main
              git push origin HEAD:main
            else
              echo "Nessuna nuova notizia MMO da salvare."
            fi
          fi
